name: build
on:
  release:
    types: [published]

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  JAVA_VERSION: 17
  # https://github.com/android-actions/setup-android?tab=readme-ov-file#sdk-version-selection
  CMDLINE_TOOLS_VERSION: 10406996 # 11.0

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            ffmpeg \
            file \
            libgtk-3-dev \
            ninja-build \
            pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Flutter
        uses: actions/cache@v4
        with:
          path: app/.flutter
          key: ${{ runner.os }}-flutter-${{ hashFiles('app/flutter', 'app/pubspec.lock') }}

      - name: Build AppImage
        id: appimage
        run: |
          ./app/scripts/build-appimage
          echo "artifact=$(find app/build -maxdepth 1 -name 'stride-desktop_*.AppImage' -print -quit)" \
            >> "$GITHUB_OUTPUT"

      - name: Upload AppImage artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: stride-appimage
          path: ${{ steps.appimage.outputs.artifact }}

      - name: Upload AppImage to release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.appimage.outputs.artifact }}
          tag: ${{ github.ref }}

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6

      - name: Disable rustup auto-self-update
        run: rustup set auto-self-update disable

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: ${{ env.CMDLINE_TOOLS_VERSION }}

      - name: Install icon generation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg jpegoptim optipng

      # Workaround: https://github.com/android-actions/setup-android/issues/461
      - name: Access Android SDK build-tools
        run:
          echo "$ANDROID_HOME/build-tools"/*/ | awk -F' ' '{ print $1 }' >>
          $GITHUB_PATH

      - name: Cache Flutter pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            **/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle

      - name: Build APKs
        env:
          STRIDE_APPLICATION_ID: ${{ github.event_name == 'release' && 'org.stridetasks.stride' || 'org.stridetasks.stride.dev' }}
        run: |
          # Use the same build dir, this speeds up the build process
          export REUSE_BUILD=1
          ./scripts/reproducible apk --release --split-per-abi
          ./scripts/reproducible apk --release

      - name: Archive mappings
        run: |
          mv app/build/reproducible/mapping/{release,mapping}
          tar -czvf mapping.tar.gz --directory=app/build/reproducible/mapping mapping

      - name: Sign APKs
        if: github.event_name == 'release' || github.event_name == 'push'
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYALIAS: ${{ secrets.KEYALIAS }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYPASS: ${{ secrets.KEYPASS }}
        run: |
          echo "$KEYSTORE" | base64 -d - > keystore.p12
          for name in armeabi-v7a-release arm64-v8a-release x86_64-release release; do
            apk="app/build/reproducible/flutter-apk/app-${name}.apk"
            signed_apk="app/build/reproducible/flutter-apk/app-${name}-signed.apk"
            apksigner sign \
              --ks ./keystore.p12 \
              --ks-key-alias "$KEYALIAS" \
              --ks-pass env:KEYSTORE_PASS \
              --key-pass env:KEYPASS \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "$signed_apk" \
              "$apk"
            mv "$signed_apk" "$apk"
          done
          rm keystore.p12

      - name: Prepare APK filenames
        env:
          APK_PREFIX: ${{ github.event_name == 'release' && 'stride' || 'stride-dev' }}
        run: |
          mkdir -p apk-artifacts
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "app/build/reproducible/flutter-apk/app-${abi}-release.apk" \
              "apk-artifacts/${APK_PREFIX}-${abi}.apk"
          done
          cp app/build/reproducible/flutter-apk/app-release.apk \
            "apk-artifacts/${APK_PREFIX}.apk"

      - name: Upload artifacts (workflow run)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: stride-artifacts
          path: |
            apk-artifacts/*.apk
            mapping.tar.gz

      - name: Upload Arifact armeabi-v7a
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "apk-artifacts/stride-armeabi-v7a.apk"
          asset_name: stride-armeabi-v7a.apk
          tag: ${{ github.ref }}

      - name: Upload Arifact arm64-v8a
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "apk-artifacts/stride-arm64-v8a.apk"
          asset_name: stride-arm64-v8a.apk
          tag: ${{ github.ref }}

      - name: Upload Arifact x86_64
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "apk-artifacts/stride-x86_64.apk"
          asset_name: stride-x86_64.apk
          tag: ${{ github.ref }}

      - name: Upload Arifact Universal
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "apk-artifacts/stride.apk"
          asset_name: stride.apk
          tag: ${{ github.ref }}

      - name: Upload Arifact Mapping
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "mapping.tar.gz"
          asset_name: mapping.tar.gz
          tag: ${{ github.ref }}

  publish-development:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [appimage, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download development artifacts
        uses: actions/download-artifact@v4
        with:
          path: development-artifacts

      - name: Publish development pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if gh release view development --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release edit development \
              --repo "$REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "development" \
              --notes "Development build from $REPOSITORY@$GITHUB_SHA."
          else
            gh release create development \
              --repo "$REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "development" \
              --notes "Development build from $REPOSITORY@$GITHUB_SHA."
          fi

          # Delete existing assets from the development release before uploading new ones.
          mapfile -t existing_assets < <(
            gh release view development \
              --repo "$REPOSITORY" \
              --json assets \
              --jq '.assets[].name'
          )
          for asset in "${existing_assets[@]}"; do
            gh release delete-asset development "$asset" \
              --repo "$REPOSITORY" \
              --yes
          done

          mapfile -t artifacts < <(
            find development-artifacts -type f -print
          )
          gh release upload development "${artifacts[@]}" \
            --repo "$REPOSITORY" \
            --clobber

  publish-fdroid:
    if: >-
      ${{
        always() &&
        needs.build.result == 'success' &&
        (
          github.event_name == 'release' ||
          (
            github.event_name == 'push' &&
            github.ref == 'refs/heads/main' &&
            needs.publish-development.result == 'success'
          )
        )
      }}
    needs: [build, publish-development]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger F-Droid rebuild
        env:
          GH_TOKEN: ${{ secrets.FDROID_DISPATCH_TOKEN }}
          CHANNEL: ${{ github.event_name == 'release' && 'release' || 'development' }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || 'development' }}
        run: |
          gh api \
            --method POST \
            repos/stride-tasks/fdroid/dispatches \
            -f event_type=stride-android-build \
            -f "client_payload[channel]=$CHANNEL" \
            -f "client_payload[release_tag]=$RELEASE_TAG"
