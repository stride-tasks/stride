name: build
on:
  release:
    types: [published]

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  JAVA_VERSION: 17
  # https://github.com/android-actions/setup-android?tab=readme-ov-file#sdk-version-selection
  CMDLINE_TOOLS_VERSION: 10406996 # 11.0

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            ffmpeg \
            file \
            libgtk-3-dev \
            ninja-build \
            pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Flutter
        uses: actions/cache@v4
        with:
          path: app/.flutter
          key: ${{ runner.os }}-flutter-${{ hashFiles('app/flutter', 'app/pubspec.lock') }}

      - name: Build AppImage
        id: appimage
        run: |
          ./app/scripts/build-appimage
          echo "artifact=$(find app/build -maxdepth 1 -name 'stride-desktop_*.AppImage' -print -quit)" \
            >> "$GITHUB_OUTPUT"

      - name: Upload AppImage artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: stride-appimage
          path: ${{ steps.appimage.outputs.artifact }}

      - name: Upload AppImage to release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.appimage.outputs.artifact }}
          tag: ${{ github.ref }}

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6

      - name: Disable rustup auto-self-update
        run: rustup set auto-self-update disable

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: ${{ env.CMDLINE_TOOLS_VERSION }}

      - name: Install icon generation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg jpegoptim optipng

      # Workaround: https://github.com/android-actions/setup-android/issues/461
      - name: Access Android SDK build-tools
        run:
          echo "$ANDROID_HOME/build-tools"/*/ | awk -F' ' '{ print $1 }' >>
          $GITHUB_PATH

      - name: Cache Flutter pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            **/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle

      - name: Build APKs
        env:
          STRIDE_APPLICATION_ID: ${{ github.event_name == 'release' && 'org.stridetasks.stride' || 'org.stridetasks.stride.dev' }}
        run: |
          # Use the same build dir, this speeds up the build process
          export REUSE_BUILD=1
          ./scripts/reproducible apk --release --split-per-abi
          ./scripts/reproducible apk --release

      - name: Archive mappings
        run: |
          mv app/build/reproducible/mapping/{release,mapping}
          tar -czvf mapping.tar.gz --directory=app/build/reproducible/mapping mapping

      - name: Sign APKs
        if: github.event_name == 'release' || github.event_name == 'push'
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYALIAS: ${{ secrets.KEYALIAS }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYPASS: ${{ secrets.KEYPASS }}
        run: |
          echo "$KEYSTORE" | base64 -d - > keystore.p12
          for name in armeabi-v7a-release arm64-v8a-release x86_64-release release; do
            apk="app/build/reproducible/flutter-apk/app-${name}.apk"
            signed_apk="app/build/reproducible/flutter-apk/app-${name}-signed.apk"
            apksigner sign \
              --ks ./keystore.p12 \
              --ks-key-alias "$KEYALIAS" \
              --ks-pass env:KEYSTORE_PASS \
              --key-pass env:KEYPASS \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "$signed_apk" \
              "$apk"
            mv "$signed_apk" "$apk"
          done
          rm keystore.p12

      - name: Upload artifacts (workflow run)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: stride-artifacts
          path: |
            app/build/reproducible/flutter-apk/app-armeabi-v7a-release.apk
            app/build/reproducible/flutter-apk/app-arm64-v8a-release.apk
            app/build/reproducible/flutter-apk/app-x86_64-release.apk
            app/build/reproducible/flutter-apk/app-release.apk
            mapping.tar.gz

      - name: Upload Arifact armeabi-v7a
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "app/build/reproducible/flutter-apk/app-armeabi-v7a-release.apk"
          asset_name: stride-armeabi-v7a.apk
          tag: ${{ github.ref }}

      - name: Upload Arifact arm64-v8a
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "app/build/reproducible/flutter-apk/app-arm64-v8a-release.apk"
          asset_name: stride-arm64-v8a.apk
          tag: ${{ github.ref }}

      - name: Upload Arifact x86_64
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "app/build/reproducible/flutter-apk/app-x86_64-release.apk"
          asset_name: stride-x86_64.apk
          tag: ${{ github.ref }}

      - name: Upload Arifact Universal
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "app/build/reproducible/flutter-apk/app-release.apk"
          asset_name: stride.apk
          tag: ${{ github.ref }}

      - name: Upload Arifact Mapping
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "mapping.tar.gz"
          asset_name: mapping.tar.gz
          tag: ${{ github.ref }}
