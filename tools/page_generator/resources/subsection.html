<div id="@SUB_ID@"
  class="mt-3 rounded-md border border-slate-200 bg-slate-50 p-3 dark:border-slate-700 dark:bg-slate-800/50">
  <div class="mb-2 flex items-center justify-between gap-2">
    <div>
      %if !empty(SUB_TYPE)%
      <p class="text-[9px] font-semibold uppercase tracking-[0.2em] text-slate-500 dark:text-slate-400">
        %expand(SUB_TYPE)%
      </p>
      %%
      %if !empty(TITLE)%
      <h3 class="text-lg font-semibold text-slate-900 dark:text-slate-100">%expand(TITLE)%</h3>
      %%
    </div>
    %if !empty(GROUP)%
    <span
      class="rounded-full bg-slate-200 px-2 py-0.5 text-[10px] font-medium text-slate-700 dark:bg-slate-700 dark:text-slate-200">@GROUP@</span>
    %%
  </div>
  %if !empty(DESCRIPTION)%
  <div class="mb-3">
    <p class="text-sm text-slate-600 dark:text-slate-300">@DESCRIPTION@</p>
  </div>
  %%
  @TABLE@
  @INNER@
</div>
