name: stride
description: Task management tool that synchronizes with Git.
publish_to: "none"
homepage: https://github.com/stride-tasks/stride
repository: https://github.com/stride-tasks/stride

version: 0.0.1+2

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  ffi: ^2.2.0
  stride_flutter_bridge:
    path: rust_builder
  uuid: ^4.6.0
  path: ^1.9.1
  path_provider: ^2.1.6
  freezed_annotation: ^3.1.0
  font_awesome_flutter: ^11.0.0
  file_picker: ^11.0.3
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2
  intersperse: ^2.0.0
  http: ^1.6.0
  flutter_native_splash: ^2.4.8
  flutter_foreground_task: ^11.0.3
  async: ^2.13.0
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # integration_test:
  #   sdk: flutter

  flutter_lints: ^6.0.0

  freezed: ^3.2.4
  json_serializable: ^6.14.1
  build_runner: ^2.15.1

  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# https://pub.dev/packages/flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/logo.png"
  android: true
  adaptive_icon_background: "#282828"
  adaptive_icon_foreground: "assets/icon/logo_foreground.png"
  min_sdk_android: 16 # android min sdk min:16, default 21
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true

# https://pub.dev/packages/flutter_native_splash
flutter_native_splash:
  color: "#282828"
  image: assets/icon/logo.png
  web: false
