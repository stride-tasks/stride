[workspace]
resolver = "3"
members = [
  "crates/api",
  "crates/api_codegen",
  "crates/api_codegen_cli",
  "crates/crdt",
  "crates/serialization",
  "crates/logging",
  "crates/sqlite",
  "crates/database",
  "crates/backends/git",
  "crates/crypto",
  "crates/plugin",
  "crates/plugin_manager",
  "crates/engine",
  "crates/flutter_bridge",
  "tools/page_generator",
  "cli",
]

exclude = ["app"]

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.100.1"
authors = ["Haled Odat <haledodat@gmail.com>"]
repository = "https://github.com/HalidOdat/stride"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
# Repository Crates
stride_api = { version = "~0.1.0", path = "crates/api" }
stride_api_codegen = { version = "~0.1.0", path = "crates/api_codegen" }
stride_crdt = { version = "~0.1.0", path = "crates/crdt" }
stride_serialize = { version = "~0.1.0", path = "crates/serialization" }
stride_logging = { version = "~0.1.0", path = "crates/logging" }
stride_sqlite = { version = "~0.1.0", path = "crates/sqlite" }
stride_database = { version = "~0.1.0", path = "crates/database" }
stride_backend_git = { version = "~0.1.0", path = "crates/backends/git" }
stride_crypto = { version = "~0.1.0", path = "crates/crypto" }
stride_plugin_manager = { version = "~0.1.0", path = "crates/plugin_manager" }
stride_engine = { version = "~0.1.0", path = "crates/engine" }

# Shared Dependencies
rusqlite = { version = "0.43.0", features = ["bundled", "uuid", "array", "fallible_uint"] }
serde = { version = "1.0", features = ["derive"] }
serde_with = "3.25"
serde_json = "1.0"
uuid = { version = "1.29.3", features = ["v7", "serde"] }
chrono = { version = "0.4.45", features = ["serde", "now"] }
anyhow = "1.0"
git2 = { version = "0.21.0", default-features = false, features = [
  "ssh",
  "vendored-libgit2",
  "vendored-openssl",
] }
base64 = "0.23.1"
openssl = { version = "0.10.82", features = ["vendored"] }
log = { version = "0.4.35" }
env_logger = { version = "0.11.12", default-features = false }
getrandom = "0.4.3"
zeroize = { version = "1.9.2", features = ["zeroize_derive"] }
dirs = "7.0.0"
toml = "1.2.3"
zip = "9.9.0"
wat = "1.263.0"
wasmi = "2.0.4"
wasmi_wasi = "2.0.4"
clap = { version = "4.6.10", features = ["derive"] }
url = { version = "2.5.9", features = ["serde"] }
thiserror = "2.0.21"
indoc = "2.0.8"
vint64 = "=1.0.1"
inquire = "0.9.5"
comfy-table = "8.0.1"
indexmap = "2.14.2"
smol = "2.0.2"
async-channel = "2.5.0"
futures-lite = "2.6.1"
async-trait = "0.1.92"

[profile.release]
# strip = "debug"
opt-level = "z"
lto = true
codegen-units = 1

[profile.release-debug]
inherits = "release"
debug = true
strip = "none"

[workspace.lints.rust]
# rustc lint groups https://doc.rust-lang.org/rustc/lints/groups.html
warnings = "warn"
future_incompatible = { level = "warn", priority = -1 }
let_underscore = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_compatibility = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2021_compatibility = { level = "warn", priority = -1 }
unused = { level = "warn", priority = -1 }

# rustc allowed-by-default lints https://doc.rust-lang.org/rustc/lints/listing/allowed-by-default.html
# missing_docs = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_abi = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
non_ascii_idents = "warn"
noop_method_call = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_crate_dependencies = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"

[workspace.lints.rustdoc]
# rustdoc lints https://doc.rust-lang.org/rustdoc/lints.html
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
missing_crate_level_docs = "warn"
private_doc_tests = "warn"
invalid_codeblock_attributes = "warn"
invalid_rust_codeblocks = "warn"
bare_urls = "warn"

[workspace.lints.clippy]
# clippy allowed by default
dbg_macro = "warn"

# clippy categories https://doc.rust-lang.org/clippy/
all = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
